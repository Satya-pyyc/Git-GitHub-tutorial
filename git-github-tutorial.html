const note=t=>'<div class="note">💡 '+t+'</div>',warn=t=>'<div class="warn">⚠️ <b>Careful:</b> '+t+'</div>',tip=t=>'<div class="tip">✅ <b>Best practice:</b> '+t+'</div>';

/* ---------- lessons ---------- */
const L=[
{t:'1. What is Git?',b:()=>`
<h2>The big idea</h2>
<p><b>Git</b> is a tool that remembers every version of your project, like unlimited "save points" in a video game. If you break something, you can go back. If two people work together, Git helps combine their work.</p>
<p><b>Version control</b> = keeping a history of changes. Git is <i>distributed</i>: every developer has a full copy of the history, so you can work offline and nothing is lost if one server dies.</p>
<h2>Git vs GitHub</h2>
<table><tr><th></th><th>Git</th><th>GitHub</th></tr>
<tr><td>What</td><td>Program on your computer</td><td>Website that hosts Git repositories</td></tr>
<tr><td>Needs internet?</td><td>No</td><td>Yes</td></tr>
<tr><td>Extras</td><td>Commits, branches, merges</td><td>Pull requests, issues, Actions, Pages</td></tr>
<tr><td>Alternatives</td><td>—</td><td>GitLab, Bitbucket</td></tr></table>
<h2>Words you will see</h2>
<table><tr><th>Term</th><th>Plain meaning</th></tr>
<tr><td>Repository (repo)</td><td>A project folder plus its history</td></tr><tr><td>Commit</td><td>A saved snapshot with a message</td></tr>
<tr><td>Branch</td><td>A separate line of work</td></tr><tr><td>Merge</td><td>Combine two branches</td></tr>
<tr><td>Clone</td><td>Copy a remote repo to your computer</td></tr><tr><td>Remote</td><td>A copy of the repo on a server (usually named <code>origin</code>)</td></tr>
<tr><td>Push / Pull</td><td>Upload / download commits</td></tr></table>
${tip('Think of Git as the camera and GitHub as the photo album you share online.')}`},

{t:'2. Install & configure',b:()=>`
<h2>Install</h2>
<table><tr><th>System</th><th>How</th></tr>
<tr><td>Windows</td><td>Download from git-scm.com and run the installer. It includes <b>Git Bash</b>.</td></tr>
<tr><td>macOS</td><td><code>brew install git</code> (or run <code>git --version</code> and accept the Xcode tools prompt)</td></tr>
<tr><td>Linux (Debian/Ubuntu)</td><td><code>sudo apt install git</code></td></tr></table>
${code(`$ git --version
git version 2.x.x`)}
<h2>Tell Git who you are</h2>
<p>Every commit stores a name and email. Set them once:</p>
${code(`$ git config --global user.name "Your Name"
$ git config --global user.email "you@example.com"
$ git config --global init.defaultBranch main
$ git config --list`)}
<p><code>--global</code> applies to every repo for your user. Leave it off (inside a repo) to set a <b>local</b> value for that project only.</p>
${note('Common mistake: forgetting this step. Your first commit then fails with <code>Author identity unknown</code>.')}`},

{t:'3. Your first repository',b:()=>`
<h2>The three places your files live</h2>
<p>Git moves changes through three areas: <b>Working Directory</b> (your files) → <b>Staging Area</b> (what goes in the next commit) → <b>Repository</b> (saved history). Try it:</p>
<div class="lab" id="lab1"><div class="zones"><div class="zone" data-z="0">Working Directory</div><div class="zone" data-z="1">Staging Area</div><div class="zone" data-z="2">Repository</div></div>
<button data-s="edit">Edit notes.txt</button> <button data-s="add">git add notes.txt</button> <button data-s="commit">git commit</button> <button data-s="reset">Reset</button>
<p class="out" aria-live="polite">Click "Edit notes.txt" to start.</p></div>
<h2>Commands, step by step</h2>
${code(`$ mkdir my-project
$ cd my-project
$ git init
Initialized empty Git repository in .../my-project/.git/
$ echo "Hello Git" > notes.txt
$ git status
$ git add notes.txt
$ git commit -m "Add notes file"
$ git log --oneline`)}
<ul><li><code>git init</code> creates the hidden <code>.git</code> folder, the database of your history. Never delete it by accident.</li>
<li><code>git status</code> is your best friend: run it often.</li>
<li><code>git add .</code> stages everything in the folder.</li></ul>
${warn('<code>rm -rf .git</code> erases all history of the project. Files stay, history is gone.')}`},

{t:'4. Commit history & diffs',b:()=>`
<h2>See what changed</h2>
${code(`$ git diff              # unstaged changes
$ git diff --staged     # staged changes
$ git log --oneline --graph --all
$ git show              # latest commit in detail
$ git diff a1b2c3d e4f5a6b`)}
<p>Each commit has a <b>hash</b> (like <code>a1b2c3d</code>), a unique ID made from its content. Use the first 7 characters.</p>
<h2>Good commit messages</h2>
<table><tr><th>Bad</th><th>Good</th></tr><tr><td>fix stuff</td><td>Fix login crash when password is empty</td></tr><tr><td>update</td><td>Add dark mode toggle to settings page</td></tr></table>
${tip('Write in the imperative ("Add", "Fix"), keep the first line under 50 characters, and make each commit one logical change.')}
<h2>Files</h2>
${code(`$ git mv old.txt new.txt     # rename
$ git rm notes.txt           # delete and stage
$ git rm --cached secret.txt # untrack but keep the file
$ echo "node_modules/" >> .gitignore`)}
<p><code>.gitignore</code> lists files Git should never track, such as <code>.env</code>, logs and build folders.</p>`},

{t:'5. Branching',b:()=>`
<h2>What is a branch?</h2>
<p>A branch is just a movable label pointing at a commit. Creating one is instant and cheap, so use one for every feature or fix. <b>HEAD</b> tells Git which branch you are on.</p>
<div class="lab" id="lab2"><svg id="bsvg" viewBox="0 0 560 110" width="100%" role="img" aria-label="Branch diagram"></svg>
<button data-b="commit">git commit</button> <button data-b="branch">git switch -c feature</button> <button data-b="main">git switch main</button> <button data-b="feat">git switch feature</button> <button data-b="merge">git merge feature</button> <button data-b="reset">Reset</button>
<p class="out" id="bout" aria-live="polite">Make a commit, then create a branch.</p></div>
${code(`$ git branch                    # list
$ git switch -c feature-login   # create + switch
$ git switch main
$ git branch -m new-name        # rename current branch
$ git branch -d feature-login   # delete (only if merged)`)}
${note('Older tutorials use <code>git checkout</code>. <code>git switch</code> does the same job for branches and is easier to remember.')}`},

{t:'6. Merging & conflicts',b:()=>`
<h2>Merging</h2>
${code(`$ git switch main
$ git merge feature-login`)}
<ul><li><b>Fast-forward:</b> main has no new commits, so Git just moves the label forward.</li><li><b>Three-way merge:</b> both branches changed, so Git creates a new merge commit.</li></ul>
<h2>Conflicts</h2>
<p>A conflict happens when two branches edit the <i>same lines</i>. Example: Asha and Ben both change line 1 of <code>title.txt</code>. Git stops and marks the file:</p>
${code(`<<<<<<< HEAD
Welcome to Our App
=======
Welcome to My App
>>>>>>> feature-login`)}
<p>Fix it in 4 steps: 1) open the file, 2) keep the text you want and delete the three marker lines, 3) <code>git add title.txt</code>, 4) <code>git commit</code>.</p>
${code(`$ git status          # shows "both modified"
$ git merge --abort   # changed your mind? go back safely`)}
${tip('Merge main into your branch often, and keep branches short-lived. Smaller differences mean fewer conflicts.')}`},

{t:'7. GitHub & remotes',b:()=>`
<h2>Upload your project</h2>
<ol><li>Create a free account at github.com.</li><li>Click <b>New repository</b>, name it, choose public or private, and do <i>not</i> add files if you already have a local project.</li><li>Copy the repository URL.</li></ol>
${code(`$ git remote add origin https://github.com/YOUR-USERNAME/my-project.git
$ git branch -M main
$ git push -u origin main
$ git remote -v`)}
<h2>Push, fetch, pull, clone</h2>
<table><tr><th>Command</th><th>What it does</th></tr>
<tr><td><code>git clone URL</code></td><td>Copy a remote repo to your computer</td></tr>
<tr><td><code>git push</code></td><td>Upload your commits</td></tr>
<tr><td><code>git fetch</code></td><td>Download remote commits <i>without</i> changing your files</td></tr>
<tr><td><code>git pull</code></td><td>Fetch + merge in one step</td></tr></table>
<h2>HTTPS vs SSH</h2>
<p>HTTPS asks for a token as password. SSH uses a key pair: <code>ssh-keygen -t ed25519</code>, then add the <b>.pub</b> file to GitHub settings.</p>
${warn('Never share your private key (no <code>.pub</code>) or a personal access token. Never paste them in a repo.')}
${note('<code>rejected: non-fast-forward</code> means the remote has commits you lack. Run <code>git pull</code>, fix any conflicts, then push again.')}`},

{t:'8. Undoing changes',b:()=>`
<h2>Pick the right undo</h2>
<table><tr><th>Goal</th><th>Command</th><th>Safe?</th></tr>
<tr><td>Discard edits to a file</td><td><code>git restore file</code></td><td>❌ edits lost</td></tr>
<tr><td>Unstage a file</td><td><code>git restore --staged file</code></td><td>✅</td></tr>
<tr><td>Fix last commit message</td><td><code>git commit --amend</code></td><td>⚠️ rewrites history</td></tr>
<tr><td>Undo a pushed commit</td><td><code>git revert HASH</code></td><td>✅ adds a new commit</td></tr>
<tr><td>Move branch back, keep changes staged</td><td><code>git reset --soft HEAD~1</code></td><td>✅</td></tr>
<tr><td>Move branch back, keep files</td><td><code>git reset --mixed HEAD~1</code></td><td>✅</td></tr>
<tr><td>Move back and erase changes</td><td><code>git reset --hard HEAD~1</code></td><td>❌ destructive</td></tr></table>
${warn('<code>reset --hard</code> and <code>git clean -f</code> delete uncommitted work permanently. Preview deletions first with <code>git clean -n</code>.')}
${tip('For anything already pushed, use <code>revert</code>. Rewriting shared history breaks your teammates&#39; copies.')}
<h2>Lost a commit?</h2>
${code(`$ git reflog           # list where HEAD has been
$ git switch -c rescue a1b2c3d`)}
<h2>Stash: park unfinished work</h2>
${code(`$ git stash push -m "Work in progress"
$ git switch other-branch      # do urgent work
$ git switch -
$ git stash list
$ git stash pop                # restore and remove`)}`},

{t:'9. Rebase, cherry-pick, tags',b:()=>`
<h2>Rebase</h2>
<p>Rebase replays your commits on top of another branch, giving a straight, tidy history instead of a merge commit.</p>
${code(`$ git switch feature
$ git rebase main
$ git rebase -i HEAD~3     # squash or reorder last 3 commits
$ git rebase --abort`)}
${warn('Never rebase commits that teammates already pulled. Rebase only your own local or feature work.')}
<h2>Cherry-pick</h2>
<p>Copy one specific commit onto the current branch: <code>git cherry-pick a1b2c3d</code></p>
<h2>Tags and releases</h2>
${code(`$ git tag v1.0.0
$ git tag -a v1.0.0 -m "Version 1.0.0"
$ git push origin v1.0.0
$ git push origin --tags`)}
<p><b>Semantic versioning:</b> MAJOR.MINOR.PATCH, e.g. 2.4.1. Breaking change → MAJOR, new feature → MINOR, bug fix → PATCH. On GitHub, open <b>Releases → Draft a new release</b> and choose your tag.</p>`},

{t:'10. Teamwork & pull requests',b:()=>`
<h2>Contributing to open source</h2>
${code(`# 1. Click "Fork" on GitHub
$ git clone https://github.com/YOUR-USERNAME/project.git
$ cd project
$ git remote add upstream https://github.com/ORIGINAL-OWNER/project.git
$ git switch -c feat/add-search
# ...edit, then:
$ git add .
$ git commit -m "Add search box to header"
$ git push -u origin feat/add-search`)}
<p>Then open GitHub and click <b>Compare & pull request</b>. Explain <i>what</i> changed, <i>why</i>, and how to test it. Reviewers comment; you push more commits to the same branch and the PR updates.</p>
<h2>GitHub Flow</h2>
<p>1) Branch from main → 2) commit → 3) open a pull request → 4) review → 5) merge → 6) delete the branch.</p>
${tip('Use branch names like <code>feat/login</code>, <code>fix/crash-on-start</code>. Turn on branch protection so main needs a reviewed PR.')}`},

{t:'11. Security & DevOps',b:()=>`
<h2>Keep secrets out of Git</h2>
${code(`$ echo ".env" >> .gitignore
$ echo "*.pem" >> .gitignore
$ echo "terraform.tfstate*" >> .gitignore`)}
${warn('Deleting a secret in a later commit is <b>not enough</b>: it stays in history. If a secret is committed, <b>revoke and rotate it immediately</b>, then clean history with <code>git filter-repo</code> if needed.')}
<ul><li>Turn on two-factor authentication on GitHub.</li><li>Use GitHub secret scanning and Actions <i>Secrets</i> for credentials.</li></ul>
<h2>Git for DevOps</h2>
<p>Git stores shell scripts, Dockerfiles, Kubernetes YAML, Terraform, and Ansible. Every change is reviewed, versioned, and easy to roll back, which is the idea behind <b>Infrastructure as Code</b>.</p>
${code(`name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Run tests here"`)}
<p>Save that as <code>.github/workflows/ci.yml</code> and push: GitHub runs it on every push.</p>`},

{t:'12. Troubleshooting',b:()=>`
<table><tr><th>Error</th><th>Meaning and fix</th></tr>
<tr><td><code>not a git repository</code></td><td>You are in the wrong folder. <code>cd</code> into the project or run <code>git init</code>.</td></tr>
<tr><td><code>Author identity unknown</code></td><td>Set <code>user.name</code> and <code>user.email</code> (lesson 2).</td></tr>
<tr><td><code>remote origin already exists</code></td><td>Use <code>git remote set-url origin URL</code>.</td></tr>
<tr><td><code>src refspec main does not match any</code></td><td>No commit yet, or branch has a different name. Commit first, then <code>git branch -M main</code>.</td></tr>
<tr><td><code>non-fast-forward</code></td><td>Run <code>git pull</code>, resolve, push.</td></tr>
<tr><td><code>Permission denied (publickey)</code></td><td>SSH key not added to GitHub. Test with <code>ssh -T git@github.com</code>.</td></tr>
<tr><td>Detached HEAD</td><td>You checked out a commit. Save work with <code>git switch -c new-branch</code>.</td></tr>
<tr><td>Deleted a branch by mistake</td><td>Find its tip with <code>git reflog</code>, then <code>git branch name HASH</code>.</td></tr>
<tr><td><code>unrelated histories</code></td><td>Two repos started separately. Use <code>git pull origin main --allow-unrelated-histories</code>.</td></tr></table>
${tip('When confused, run <code>git status</code>. It almost always tells you the next step.')}`},

{t:'13. Cheat sheet & quiz',b:()=>`
<h2>Cheat sheet</h2>
<table><tr><th>Task</th><th>Commands</th></tr>
<tr><td>Start</td><td><code>git init</code>, <code>git clone URL</code></td></tr>
<tr><td>Save</td><td><code>git status</code>, <code>git add .</code>, <code>git commit -m "msg"</code></td></tr>
<tr><td>Branch</td><td><code>git switch -c name</code>, <code>git merge name</code></td></tr>
<tr><td>Remote</td><td><code>git remote -v</code>, <code>git push</code>, <code>git pull</code>, <code>git fetch</code></td></tr>
<tr><td>Undo</td><td><code>git restore</code>, <code>git revert</code>, <code>git reflog</code></td></tr>
<tr><td>Stash</td><td><code>git stash</code>, <code>git stash pop</code></td></tr>
<tr><td>Inspect</td><td><code>git log --oneline --graph</code>, <code>git diff</code>, <code>git blame file</code></td></tr></table>
<h2>Final assessment</h2><div id="quiz"></div><button class="primary" id="qsub">Submit answers</button><p id="qres" aria-live="polite"></p>`}
];

const save=()=>{try{localStorage.setItem('gitdone',JSON.stringify(done))}catch(e){}};
function nav(filter=''){
 $('#list').innerHTML=`<a href="#home" data-i="-1">🏠 Start here</a>`+L.map((l,i)=>({l,i})).filter(o=>!filter||(o.l.t+o.l.b()).toLowerCase().includes(filter)).map(o=>`<a href="#l${o.i}" data-i="${o.i}" class="${o.i===cur?'on':''}">${o.l.t}<span class="ck">${done.includes(o.i)?'✓':''}</span></a>`).join('');
 const p=Math.round(done.length/L.length*100);$('#pct').textContent=p+'% complete';$('#fill').style.width=p+'%';
}
function show(i){
 cur=i;const m=$('#main');
 if(i<0){m.innerHTML=`<section class="hero"><h1>Git & GitHub: Beginner to Master</h1><p>Learn version control step by step with plain-English notes, copy-ready commands, and hands-on demos. No setup needed: everything here runs in your browser.</p>
 <svg viewBox="0 0 520 90" role="img" aria-label="Commit graph"><g stroke="#3ccfcf" stroke-width="3" fill="none"><path d="M20 30H500"/><path d="M140 30Q170 70 200 70H320Q350 70 380 30"/></g><g fill="#0d1820" stroke="#3ccfcf" stroke-width="3"><circle cx="20" cy="30" r="9"/><circle cx="140" cy="30" r="9"/><circle cx="380" cy="30" r="9"/><circle cx="500" cy="30" r="9"/><circle cx="220" cy="70" r="9"/><circle cx="300" cy="70" r="9"/></g></svg>
 <p><button class="primary" onclick="location.hash='#l0'">Start lesson 1</button></p></section>
 <h2>Your roadmap</h2><ol>${L.map(l=>`<li><a href="#l${L.indexOf(l)}">${l.t.replace(/^\d+\. /,'')}</a></li>`).join('')}</ol>`;}
 else{
  m.innerHTML=`<h1>${L[i].t.replace(/^\d+\. /,'')}</h1><div id="toc" class="toc"></div>${L[i].b()}
  <p><button class="primary" id="mark">${done.includes(i)?'✓ Completed (undo)':'Mark lesson complete'}</button></p>
  <div class="pager"><button ${i?'':'disabled'} onclick="location.hash='#l${i-1}'">← Previous</button><button ${i<L.length-1?'':'disabled'} onclick="location.hash='#l${i+1}'">Next →</button></div>`;
  m.querySelectorAll('h2').forEach((h,k)=>h.id='s'+k);
  $('#toc').innerHTML='<b>On this page:</b> '+([...m.querySelectorAll('h2')].map(h=>`<a href="#" data-go="${h.id}">${h.textContent}</a>`).join('')||'Short lesson');
  $('#mark').onclick=()=>{done.includes(i)?done=done.filter(x=>x!==i):done.push(i);save();show(i)};
  if(i===0)document.title='Git & GitHub: Beginner to Master';
  lab1();lab2();if(i===L.length-1)quiz();
 }
 nav($('#search').value.toLowerCase());$('#nav').classList.remove('open');window.scrollTo(0,0);
}
const route=()=>{const h=location.hash;show(/^#l\d+$/.test(h)?Math.min(+h.slice(2),L.length-1):-1)};
addEventListener('hashchange',route);
document.addEventListener('click',e=>{
 const b=e.target;
 if(b.classList.contains('cp')){const t=b.nextElementSibling.textContent.split('\n').filter(l=>l.startsWith('$ ')).map(l=>l.slice(2)).join('\n')||b.nextElementSibling.textContent;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>b.textContent='Copied!').catch(()=>{const r=document.createRange();r.selectNodeContents(b.nextElementSibling);getSelection().removeAllRanges();getSelection().addRange(r);b.textContent='Selected: press Ctrl+C'});setTimeout(()=>b.textContent='Copy',1800)}
 if(b.dataset.go){e.preventDefault();document.getElementById(b.dataset.go).scrollIntoView()}
});
$('#search').oninput=e=>nav(e.target.value.toLowerCase());
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
$('#theme').onclick=()=>{const r=document.documentElement;const d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';try{localStorage.setItem('gittheme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('gittheme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}

/* ---------- lab 1: three areas ---------- */
function lab1(){
 const lab=$('#lab1');if(!lab)return;let st=-1;const zs=lab.querySelectorAll('.zone'),out=lab.querySelector('.out');
 const msg=['notes.txt is edited but Git has not been told yet.','git add copied the change into the staging area.','git commit saved a snapshot into the repository.'];
 const draw=()=>{zs.forEach((z,k)=>{z.classList.toggle('hot',k===st);const base=['Working Directory','Staging Area','Repository'][k];z.innerHTML=base+(k===st?`<br><span class="file ${st===0?'mod':''}">notes.txt${st===0?' (modified)':''}</span>`:'')});out.textContent=st<0?'Click "Edit notes.txt" to start.':msg[st]};
 lab.onclick=e=>{const s=e.target.dataset.s;if(!s)return;
  if(s==='edit')st=0;else if(s==='add'){if(st!==0){out.textContent='Nothing to add: edit the file first.';return}st=1}
  else if(s==='commit'){if(st!==1){out.textContent='Nothing staged: run git add first.';return}st=2}else st=-1;draw()};
 draw();
}
/* ---------- lab 2: branches ---------- */
function lab2(){
 const lab=$('#lab2');if(!lab)return;let C,on,hasF,out=$('#bout');
 const init=()=>{C=[{b:'m',p:[]}];on='m';hasF=false};init();
 const draw=()=>{let s='';const X=i=>30+i*60,Y=b=>b==='m'?30:75;
  C.forEach((c,i)=>c.p.forEach(p=>s+=`<line x1="${X(p)}" y1="${Y(C[p].b)}" x2="${X(i)}" y2="${Y(c.b)}" stroke="var(--acc)" stroke-width="3"/>`));
  C.forEach((c,i)=>s+=`<circle cx="${X(i)}" cy="${Y(c.b)}" r="10" fill="var(--panel)" stroke="var(--acc)" stroke-width="3"/>`);
  const tip=b=>C.map(c=>c.b).lastIndexOf(b);
  s+=`<text x="${X(tip('m'))+16}" y="34" fill="var(--ink)" font-size="13">main${on==='m'?' ← HEAD':''}</text>`;
  if(hasF)s+=`<text x="${X(tip('f'))+16}" y="79" fill="var(--ink)" font-size="13">feature${on==='f'?' ← HEAD':''}</text>`;
  $('#bsvg').innerHTML=s};
 lab.onclick=e=>{const a=e.target.dataset.b;if(!a)return;let t='';
  if(a==='commit'){const prev=C.map(c=>c.b).lastIndexOf(on);C.push({b:on,p:[C.length-1<0?0:(on==='m'||!hasF||C.map(c=>c.b).lastIndexOf(on)>=0?prev:0)]});t='New commit added to '+(on==='m'?'main':'feature')+'.'}
  else if(a==='branch'){if(hasF){t='feature already exists.'}else{hasF=true;on='f';C.push({b:'f',p:[C.length-1]});t='Created feature and switched to it. (A new commit is added here so the lines are visible.)'}}
  else if(a==='main'){on='m';t='Switched to main.'}
  else if(a==='feat'){if(!hasF)t='Create the feature branch first.';else{on='f';t='Switched to feature.'}}
  else if(a==='merge'){if(on!=='m'||!hasF)t='Switch to main (with a feature branch) first.';else{const tf=C.map(c=>c.b).lastIndexOf('f'),tm=C.map(c=>c.b).lastIndexOf('m');C.push({b:'m',p:[tm,tf]});t='Merged! main now has a merge commit joining both lines.'}}
  else{init();t='Reset.'}
  out.textContent=t;draw()};
 draw();
}
/* ---------- quiz ---------- */
function quiz(){
 $('#quiz').innerHTML=QZ.map((q,i)=>`<div class="q" id="q${i}"><b>${i+1}. ${q[0]}</b>${q[1].map((o,k)=>`<label><input type="radio" name="q${i}" value="${k}"> ${o}</label>`).join('')}</div>`).join('');
 $('#qsub').onclick=()=>{let s=0;QZ.forEach((q,i)=>{const v=document.querySelector(`input[name=q${i}]:checked`);const ok=v&&+v.value===q[2];s+=ok?1:0;$('#q'+i).className='q '+(ok?'ok':'bad')});
  const p=Math.round(s/QZ.length*100);$('#qres').innerHTML=`<b>Score: ${s}/${QZ.length} (${p}%)</b> `+(p>=80?'🎉 Excellent. You are ready to build real projects.':p>=50?'Good start. Review the green and red cards, then retry.':'Revisit lessons 1 to 8, then try again.')};
}
route();
</script>
